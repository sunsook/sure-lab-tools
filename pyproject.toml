[project]
name = "vsmmock"
version = "0.1.0"
description = "교육용 검증 도구 목업 — DVERA · STATICA/STATIC · ADS"
requires-python = ">=3.10"
dependencies = ["pycparser>=2.21", "ziglang>=0.13"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vsmmock*"]

[tool.setuptools.package-data]
"vsmmock.engine" = ["fake_libc/*.h"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
ci = ["gcovr>=7.0"]
dev = ["pytest>=8", "pytest-xdist>=3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scenario(id, stage, face): 실습 시나리오 시험 — id=시나리오 ID · stage=실습 단계 · face=agentic|cli",
]
